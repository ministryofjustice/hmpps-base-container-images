name: Build Base Container Images

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Rebuild daily at 5 AM UTC (weekdays only)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-push:
    name: Build-Scan-Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.HMPPS_SNYK_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: eclipse-temurin
            context: images/java/eclipse-temurin
            dockerfile: images/java/eclipse-temurin/Dockerfile.java21
            tag_prefix: 21-jre-jammy
            publish_latest: false
          - image_name: eclipse-temurin
            context: images/java/eclipse-temurin
            dockerfile: images/java/eclipse-temurin/Dockerfile.java25
            tag_prefix: 25-jre-jammy
            publish_latest: true
          - image_name: distroless-java
            context: images/java/distroless
            dockerfile: images/java/distroless/Dockerfile.java21
            tag_prefix: 21-jre
            publish_latest: false
          - image_name: distroless-java
            context: images/java/distroless
            dockerfile: images/java/distroless/Dockerfile.java25
            tag_prefix: 25-jre
            publish_latest: true
          - image_name: node
            context: images/node/alpine
            dockerfile: images/node/alpine/Dockerfile
            tag_prefix: 24-alpine
            publish_latest: false
          - image_name: node
            context: images/node/alpine-runtime
            dockerfile: images/node/alpine-runtime/Dockerfile
            tag_prefix: 24-alpine-runtime
            publish_latest: true
          - image_name: distroless-node
            context: images/node/distroless
            dockerfile: images/node/distroless/Dockerfile
            tag_prefix: 24
            publish_latest: true
          - image_name: python
            context: images/python/alpine
            dockerfile: images/python/alpine/Dockerfile
            tag_prefix: python3.13-alpine
            publish_latest: true
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-${{ matrix.image_name }}
          flavor: |
            latest=false
          tags: |
            # Prefix dynamic tags with the variant to prevent overwrites between matrix entries
            type=schedule,pattern={{date 'YYYYMMDD'}},prefix=${{ matrix.tag_prefix }}-
            type=ref,event=branch,prefix=${{ matrix.tag_prefix }}-
            type=ref,event=tag,prefix=${{ matrix.tag_prefix }}-
            type=ref,event=pr,prefix=${{ matrix.tag_prefix }}-
            type=sha,prefix=${{ matrix.tag_prefix }}-
            type=raw,value=${{ matrix.tag_prefix }}
            type=raw,value=latest,enable=${{ matrix.publish_latest }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'schedule') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          pull: true
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
          load: ${{ !(github.ref == 'refs/heads/main' || github.event_name == 'schedule') }}
          tags: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'schedule') && steps.meta.outputs.tags || format('snyk-scan:{0}-{1}', matrix.image_name, matrix.tag_prefix) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: security-upgrades

      - name: Resolve image reference for Snyk scan
        id: snyk_image
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event_name }}" == "schedule" ]]; then
            echo "image_ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-${{ matrix.image_name }}:${{ matrix.tag_prefix }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=snyk-scan:${{ matrix.image_name }}-${{ matrix.tag_prefix }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Snyk container scan
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true 
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          image: ${{ steps.snyk_image.outputs.image_ref }}
          args: --file=${{ matrix.dockerfile }} --sarif-file-output=snyk.sarif

      - name: Verify Snyk scan execution
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          if [[ ! -s snyk.sarif ]]; then
            echo "Snyk scan did not complete successfully (missing snyk.sarif)."
            exit 1
          fi

      - name: Prepare SARIF for upload
        if: ${{ env.SNYK_TOKEN != '' && hashFiles('snyk.sarif') != '' }}
        run: |
          set -euo pipefail

          jq '
            def severity_from_level($level):
              if $level == "error" then "8.0"
              elif $level == "warning" then "5.0"
              elif $level == "note" then "3.0"
              else "0.0" end;

            def normalize_any_severity($value):
              if $value == null then "0.0"
              elif ($value | type) == "number" then ($value | tostring)
              elif ($value | type) == "string" then
                if ($value | test("^[0-9]+(\\.[0-9]+)?$")) then $value
                elif (($value | ascii_downcase) == "critical") then "9.0"
                elif (($value | ascii_downcase) == "high") then "8.0"
                elif (($value | ascii_downcase) == "medium") then "5.0"
                elif (($value | ascii_downcase) == "low") then "3.0"
                else "0.0" end
              else "0.0" end;

            def normalize_rule:
              .properties = (.properties // {})
              | .defaultConfiguration = (.defaultConfiguration // {})
              | .properties["security-severity"] =
                  (
                    .properties["security-severity"] as $sev
                    | if $sev == null then severity_from_level(.defaultConfiguration.level)
                      else normalize_any_severity($sev)
                      end
                  );

            def fix_security_severity_fields:
              if type == "object" then
                (with_entries(.value |= fix_security_severity_fields)
                 | if has("security-severity") then
                     .["security-severity"] = normalize_any_severity(.["security-severity"])
                   else
                     .
                   end)
              elif type == "array" then
                map(fix_security_severity_fields)
              else
                .
              end;

            .runs |= map(
              .tool = (.tool // {})
              | .tool.driver = (.tool.driver // {})
              | .tool.driver.rules = ((.tool.driver.rules // []) | map(normalize_rule))
              | .tool.extensions = ((.tool.extensions // []) | map(
                  .rules = ((.rules // []) | map(normalize_rule))
                ))
            )
            | fix_security_severity_fields
          ' snyk.sarif > snyk-upload.sarif

      - name: Upload Snyk SARIF
        if: ${{ always() && env.SNYK_TOKEN != '' && hashFiles('snyk-upload.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: snyk-upload.sarif
          category: snyk-${{ matrix.image_name }}-${{ matrix.tag_prefix }}

      - name: Slack notification
        id: slack
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c  # v3
        with:
          method: chat.postMessage
          token: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID }}",
              "text": "Base image build failed for ${{ github.repository }}",
              "attachments": [
                {
                  "color": "danger",
                  "fallback": "${{ matrix.image_name }} Image Build Failed - ${{ github.workflow }} in ${{ github.repository }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🔨 ${{ matrix.image_name }} Image Build Failed"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Workflow:*\n${{ github.workflow }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Repository:*\n${{ github.repository }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Branch:*\n${{ github.ref_name }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\n${{ job.status }}"
                        }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Run"
                          },
                          "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }