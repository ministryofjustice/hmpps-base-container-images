name: Build Base Container Images

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Rebuild daily at 5 AM UTC (weekdays only)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-push:
    name: Build-Scan-Push
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: eclipse-temurin
            flavour: runtime
            context: images/java/eclipse-temurin
            dockerfile: images/java/eclipse-temurin/Dockerfile.java21
            tag_prefix: 21-jre-jammy
            publish_latest: false
          - image_name: eclipse-temurin
            flavour: runtime
            context: images/java/eclipse-temurin
            dockerfile: images/java/eclipse-temurin/Dockerfile.java25
            tag_prefix: 25-jre-jammy
            publish_latest: true
          - image_name: distroless-java
            flavour: runtime
            context: images/java/distroless
            dockerfile: images/java/distroless/Dockerfile.java21
            tag_prefix: 21-jre
            publish_latest: false
          - image_name: distroless-java
            flavour: runtime
            context: images/java/distroless
            dockerfile: images/java/distroless/Dockerfile.java25
            tag_prefix: 25-jre
            publish_latest: true
          - image_name: node
            flavour: build
            context: images/node/alpine
            dockerfile: images/node/alpine/Dockerfile
            tag_prefix: 24-alpine
            publish_latest: false
          - image_name: node
            flavour: build
            context: images/node/alpine
            dockerfile: images/node/alpine/Dockerfile.node26
            tag_prefix: 26-alpine
            publish_latest: false
          - image_name: node
            flavour: runtime
            context: images/node/alpine-runtime
            dockerfile: images/node/alpine-runtime/Dockerfile
            tag_prefix: 24-alpine-runtime
            publish_latest: true
          - image_name: node
            flavour: runtime
            context: images/node/alpine-runtime
            dockerfile: images/node/alpine-runtime/Dockerfile.node26
            tag_prefix: 26-alpine-runtime
            publish_latest: false
          - image_name: distroless-node
            flavour: runtime
            context: images/node/distroless
            dockerfile: images/node/distroless/Dockerfile
            tag_prefix: '24'
            publish_latest: true
          - image_name: distroless-node
            flavour: runtime
            context: images/node/distroless
            dockerfile: images/node/distroless/Dockerfile.node26
            tag_prefix: '26'
            publish_latest: false
          - image_name: python
            flavour: build
            context: images/python/alpine
            dockerfile: images/python/alpine/Dockerfile
            tag_prefix: python3.13-alpine
            publish_latest: true
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-docker-image.yml
    with:
      image_name: ${{ matrix.image_name }}
      flavour: ${{ matrix.flavour }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      tag_prefix: ${{ matrix.tag_prefix }}
      publish_latest: ${{ matrix.publish_latest }}
      registry: ghcr.io
    secrets:
      HMPPS_SNYK_API_KEY: ${{ secrets.HMPPS_SNYK_API_KEY }}
      HMPPS_SRE_SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
