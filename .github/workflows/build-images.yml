name: Build Base Container Images

on:
  push:
    branches:
      - main
      - initial-commit
  pull_request:
  schedule:
    # Rebuild daily at 5 AM UTC (weekdays only)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-push:
    name: Build-Scan-Push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [java, node]
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-base-${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: ./images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build local image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./images/${{ matrix.image }}
          platforms: linux/amd64
          push: false
          load: true
          tags: hmpps-base-${{ matrix.image }}:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner (table output)
        id: trivy-vuln-scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hmpps-base-${{ matrix.image }}:scan
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          timeout: 15m

      - name: Run Trivy vulnerability scanner (SARIF output)
        # Only need SARIF results if on main branch
        # if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hmpps-base-${{ matrix.image }}:scan
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image }}.sarif'
          limit-severities-for-sarif: true
          timeout: 15m

      - name: Upload Trivy scan results to GitHub Security tab
        # Only upload results if on main branch
        # if: github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-${{ matrix.image }}.sarif'

      - name: Slack notification
        id: slack
        # if: ${{ failure() }}
        uses: slackapi/slack-github-action@v2
        with:
          channel-id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "_Job:_ ${{ github.job }}\n_Status:_ ${{ job.status }}\n_Workflow:_ ${{ github.workflow }}\n_Repo:_ ${{ github.repository }}\n<https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|View on github>\n"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}