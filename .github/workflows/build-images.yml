name: Build Base Container Images

on:
  push:
    branches:
      - main
      - initial-commit
  pull_request:
  schedule:
    # Rebuild daily at 5 AM UTC (weekdays only)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-push:
    name: Build-Scan-Push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [java, node]
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-base-${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: ./images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-base-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push container image to repository
        # Only push to repo if on main branch
        # if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (table output)
        id: trivy-vuln-scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-base-${{ matrix.image }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          timeout: 15m

      - name: Run Trivy vulnerability scanner (SARIF output)
        # Only need SARIF results if on main branch
        # if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-base-${{ matrix.image }}:${{ github.sha }}
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image }}.sarif'
          limit-severities-for-sarif: true
          timeout: 15m

      - name: Upload Trivy scan results to GitHub Security tab
        # Only upload results if on main branch
        # if: github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-${{ matrix.image }}.sarif'

  notify:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: always() # && github.ref == 'refs/heads/main'
    steps:
      - name: Workflow status
        run: |
          if [[ "${{ needs.build-scan-push.result }}" == "success" ]]; then
            echo "✅ All base images built and pushed successfully"
          else
            echo "❌ Some base image builds failed"
            exit 1
          fi