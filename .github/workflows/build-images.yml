name: Build Base Container Images

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Rebuild daily at 5 AM UTC (weekdays only)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-push:
    name: Build-Scan-Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - base_image: eclipse-temurin
            base_tag: 21-jre-jammy
            os: ubuntu
          - base_image: eclipse-temurin
            base_tag: 25-jre-jammy
            os: ubuntu
          - base_image: eclipse-temurin
            base_tag: 21-jre-alpine
            os: alpine
          - base_image: eclipse-temurin
            base_tag: 25-jre-alpine
            os: alpine
          - base_image: node
            base_tag: 24-alpine
            os: alpine
          - base_image: python
            base_tag: python3.13-alpine
            os: alpine
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-${{ matrix.base_image }}
          flavor: |
            latest=true
          tags: |
            # Prefix dynamic tags with the variant to prevent overwrites between matrix entries
            type=schedule,pattern={{date 'YYYYMMDD'}},prefix=${{ matrix.base_tag }}-
            type=ref,event=branch,prefix=${{ matrix.base_tag }}-
            type=ref,event=tag,prefix=${{ matrix.base_tag }}-
            type=ref,event=pr,prefix=${{ matrix.base_tag }}-
            type=sha,prefix=${{ matrix.base_tag }}-
            type=raw,value=${{ matrix.base_tag }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./images/${{ matrix.base_image }}/${{ matrix.os }}
          platforms: linux/amd64
          push: false
          load: true
          tags: hmpps-${{ matrix.base_image }}-${{ matrix.base_tag }}-${{ matrix.os }}:scan
          build-args: |
            BASE_TAG=${{ matrix.base_tag }}
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner (table output)
        id: trivy-vuln-scan
        uses: aquasecurity/trivy-action@0.33.1
        if: github.ref != 'refs/heads/main'
        with:
          image-ref: hmpps-${{ matrix.base_image }}-${{ matrix.base_tag }}-${{ matrix.os }}:scan
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          timeout: 15m

      - name: Build and push container image
        id: build_push
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        uses: docker/build-push-action@v5
        with:
          context: ./images/${{ matrix.base_image }}/${{ matrix.os }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_TAG=${{ matrix.base_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (SARIF output)
        id: trivy-sarif
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: hmpps-${{ matrix.base_image }}-${{ matrix.base_tag }}-${{ matrix.os }}:scan
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.base_image }}-${{ matrix.base_tag }}-${{ steps.build_push.outputs.digest }}.sarif'
          limit-severities-for-sarif: true
          timeout: 15m

      - name: Annotate SARIF with variant metadata
        if: (github.ref == 'refs/heads/main' || github.event_name == 'schedule') && steps.trivy-sarif.outcome == 'success' && hashFiles(format('trivy-results-{0}-{1}-{2}.sarif', matrix.base_image, matrix.base_tag, steps.build_push.outputs.digest)) != ''
        run: |
          file="trivy-results-${{ matrix.base_image }}-${{ matrix.base_tag }}-${{ steps.build_push.outputs.digest }}.sarif"
          annotated="trivy-results-annotated-${{ matrix.base_image }}-${{ matrix.base_tag }}-${{ steps.build_push.outputs.digest }}.sarif"
          IMAGE_DIGEST="${{ steps.build_push.outputs.digest }}"
          SHORT_IMAGE_SHA="${IMAGE_DIGEST#sha256:}"
          SHORT_IMAGE_SHA="${SHORT_IMAGE_SHA:0:7}"
          # Keep automationDetails.id stable per image variant so resolved findings are closed on subsequent uploads.
          jq --arg image_ref "${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-${{ matrix.base_image }}:${{ matrix.base_tag }}-${{ matrix.os }}" --arg image_ref_digest "${{ env.REGISTRY }}/${{ github.repository_owner }}/hmpps-${{ matrix.base_image }}@${{ steps.build_push.outputs.digest }}" --arg image_digest "${{ steps.build_push.outputs.digest }}" --arg image_short_sha "$SHORT_IMAGE_SHA" --arg variant "${{ matrix.base_image }}:${{ matrix.base_tag }}:${{ matrix.os }}" '
            .runs[] |= (
              .automationDetails = { id: ("container-image/" + $variant) }
              | .invocations = ((.invocations // [{}]) | map(. + { properties: ((.properties // {}) + { image: $image_ref, image_with_digest: $image_ref_digest, image_digest: $image_digest, image_short_sha: $image_short_sha, variant: $variant }) }))
              | .results = ((.results // []) | map(
                  .message = ((.message // {}) + {
                    text: ((.message.text // "Vulnerability detected")
                      + "\n\nContainer Variant: " + $variant
                      + "\nImage Digest: " + $image_digest
                      + "\nImage Ref: " + $image_ref_digest
                      + "\nImage SHA (short): " + $image_short_sha)
                  })
                ))
            )
          ' "$file" > "$annotated"
          mv "$annotated" "$file"
        shell: bash

      - name: Upload Trivy scan results to GitHub Security tab
        if: (github.ref == 'refs/heads/main' || github.event_name == 'schedule') && steps.trivy-sarif.outcome == 'success' && hashFiles(format('trivy-results-{0}-{1}-{2}.sarif', matrix.base_image, matrix.base_tag, steps.build_push.outputs.digest)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results-${{ matrix.base_image }}-${{ matrix.base_tag }}-${{ steps.build_push.outputs.digest }}.sarif'
          category: ${{ matrix.base_image }}/${{ matrix.base_tag }}

      - name: Slack notification
        id: slack
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID }}",
              "text": "Base image build failed for ${{ github.repository }}",
              "attachments": [
                {
                  "color": "danger",
                  "fallback": "${{ matrix.base_image }} Image Build Failed - ${{ github.workflow }} in ${{ github.repository }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🔨 ${{ matrix.base_image }} Image Build Failed"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Workflow:*\n${{ github.workflow }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Repository:*\n${{ github.repository }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Branch:*\n${{ github.ref_name }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\n${{ job.status }}"
                        }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Run"
                          },
                          "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }